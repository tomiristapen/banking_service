global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'user_service'
    static_configs:
      - targets: ['user_service:2112']
  - job_name: 'payment_service'
    static_configs:
      - targets: ['payment_service:2112']
  - job_name: 'transaction_service'
    static_configs:
      - targets: ['transaction_service:2112']
  - job_name: 'smart_budget_service'
    static_configs:
      - targets: ['smart_budget_service:2112']
